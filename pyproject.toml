[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coxinh-ia"
version = "0.1.0"
description = "A multi-agent AI harness for surreal coxinha recipes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "langchain-groq>=1.1,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
