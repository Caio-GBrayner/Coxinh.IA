[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coxinh-ia"
version = "0.1.0"
description = "A multi-agent AI harness for surreal coxinha recipes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "fastmcp==4.1.6",
    "httpx>=0.27,<1",
    "langchain>=1,<2",
    "langchain-groq>=1.1,<2",
    "langfuse>=3,<4",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "tavily-python==0.8.5",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "mcp_server*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
